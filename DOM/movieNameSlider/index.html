<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Name Slider</title>

    <!--Tailwind css added-->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="flex justify-center items-center h-screen">
    
    <div class="bg-blue-500 px-8 py-8 rounded-3xl ">
        <h1 class="mb-6 text-xl font-semibold text-white">
            Some of my favorite movie names are here...
        </h1>

        <div class="flex items-center gap-6 ">
            <!-- Left side: Movie name -->
            <div id="movie-name"
                class="flex-1 text-xl font-bold text-white wrap-break-words ">
                
            </div>

            <!-- Right side: Movie poster -->
            <img id="movie-poster" src="" alt="" class="flex-1 w-44 h-60  shrink-0 object-cover rounded-xl">
        </div>
    </div>




    <script src="./js/script.js"></script>
</body>
</html>
